experiment_name: deberta_xlarge_task2
task: task2
seeds:
- 42
output_dir: outputs
data:
  dataset_name: ailsntua/QEvasion
  dataset_config: default
  question_column: question
  answer_column: interview_answer
  task1_label_column: clarity_label
  task2_label_column: evasion_label
  annotator_columns:
  - annotator1
  - annotator2
  - annotator3
  id_column: index
  eval_size: 0.2
  max_length: 192
  input_template: default
  custom_template: null
  overwrite_split: false
model:
  model_name: microsoft/deberta-xlarge
  trust_remote_code: false
  gradient_checkpointing: true
  tokenizer_use_fast: false
loss:
  name: cross_entropy
  use_class_weights: false
  focal_gamma: 2.0
training:
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 8.0e-06
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: false
  bf16: false
  logging_steps: 25
  save_total_limit: 1
  early_stopping_patience: 2
  dataloader_num_workers: 0
  metric_for_best_model: macro_f1
  greater_is_better: true
  report_to: none
  resume_from_checkpoint: null
multitask:
  lambda_task2: 1.0
  primary_metric: task2_macro_f1
